name: kelime_oyunu
description: "Türkçe Kelime Bulmaca — casual word search oyunu."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Audio & visual FX (skills.md §2)
  audioplayers: ^6.4.0
  confetti: ^0.8.0

  # State management (Bloc + Cubit hybrid — skills.md §3)
  equatable: ^2.0.5
  flutter_bloc: ^9.0.0

  # Firebase
  firebase_analytics: ^12.5.0
  firebase_crashlytics: ^5.3.0
  firebase_remote_config: ^6.6.0

  # Local storage (Hive AES encrypted — architecture.md §5)
  flutter_secure_storage: ^11.1.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Dependency injection: constructor injection only for now; add get_it
  # (or similar) if a real service locator becomes necessary.

  # Navigation (go_router — architecture.md §8)
  go_router: ^18.0.1

  # Ads & monetisation (skills.md §6)
  google_mobile_ads: ^9.1.0
  # app_tracking_transparency — add via `flutter pub add` when ATT feature is built
  # purchases_flutter — add via `flutter pub add` when IAP feature is built

  # Localisation
  intl: ^0.20.2

  # Simple scalar preferences
  shared_preferences: ^2.3.0

  # Collection utilities (firstWhereOrNull etc.)
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Testing (skills.md §2 — mockito YASAK, mocktail kullan)
  bloc_test: ^10.0.0
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  # Hive code generation — re-add when @HiveType models are first written:
  # hive_generator + build_runner are incompatible with bloc_test on this SDK;
  # pin exact versions at that point.

flutter:
  uses-material-design: true
  # gen_l10n: lib/l10n/*.arb -> lib/l10n/generated (see l10n.yaml)
  generate: true

  assets:
    # Generated puzzle packs (Python generator output — FAZ 1)
    - assets/puzzles/
    # Placeholder dirs — populate before first build
    - assets/images/
    - assets/audio/

  # Bundled offline (no google_fonts — the game must work without network).
  # Static instances cut from the Google Fonts variable masters (OFL 1.1;
  # licence text sits next to each family in assets/fonts/<family>/OFL.txt).
  # Design source: docs/design/kz-tokens.js TYPE.
  fonts:
    - family: Lora
      fonts:
        - asset: assets/fonts/lora/Lora-Medium.ttf
          weight: 500
        - asset: assets/fonts/lora/Lora-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/lora/Lora-Bold.ttf
          weight: 700
    - family: Nunito Sans
      fonts:
        - asset: assets/fonts/nunito_sans/NunitoSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/nunito_sans/NunitoSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/nunito_sans/NunitoSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/nunito_sans/NunitoSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/nunito_sans/NunitoSans-ExtraBold.ttf
          weight: 800
