include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    invalid_annotation_target: ignore
    missing_required_param: error
    missing_return: error
    todo: ignore
  exclude:
    - lib/generated/**
    - '**/*.g.dart'
    - '**/*.freezed.dart'

linter:
  rules:
    # Import discipline — relative imports FORBIDDEN (coding-standards.md §1.5)
    - always_use_package_imports

    # Return types on all named functions / methods
    - always_declare_return_types

    # Resource leaks
    - cancel_subscriptions
    - close_sinks

    # Async correctness
    - unawaited_futures

    # Print — use AppLogger / debugPrint instead (CLAUDE.md)
    - avoid_print

    # Widget / const best practices
    - prefer_const_constructors
    - prefer_const_constructors_in_immutables
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables

    # Immutability
    - prefer_final_locals
    - prefer_final_in_for_each

    # Widget tree ordering
    - sort_child_properties_last

    # Modern Dart idioms
    - use_super_parameters

    # Type safety
    - avoid_dynamic_calls
    - prefer_typing_uninitialized_variables

    # Code style
    - prefer_single_quotes
    - require_trailing_commas
    # sort_pub_dependencies intentionally disabled: packages are grouped by feature
    # (state management, storage, ads, etc.) which is more readable than A-Z order.
