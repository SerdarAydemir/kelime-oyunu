[project]
name = "kelime-gen"
version = "0.1.0"
description = "Türkçe Kelime Bulmaca — level generator"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "typer>=0.9",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff>=0.1",
    "black>=23",
    "mypy>=1.7",
]
# Build-time clue generation (scripts/generate_clues.py). Not shipped to Flutter.
clues = [
    "google-genai>=2.0",
]

[project.scripts]
kelime-gen = "kelime_gen.__main__:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100

[tool.mypy]
strict = true
# src for the kelime_gen package, scripts for sibling-imported build tools
# (e.g. generate_clues.py -> clue_engine.py).
mypy_path = ["src", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
