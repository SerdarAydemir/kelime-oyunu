[project]
name = "kelime-gen"
version = "0.1.0"
description = "Türkçe Kelime Bulmaca — level generator"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "typer>=0.9",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff>=0.1",
    "black>=23",
    "mypy>=1.7",
]

[project.scripts]
kelime-gen = "kelime_gen.__main__:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
